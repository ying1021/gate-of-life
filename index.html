<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>众生之门 - 手机/桌面兼容版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ====================== 初始化 ======================
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let W=window.innerWidth,H=window.innerHeight;
const dpr=window.devicePixelRatio||1;
canvas.width=W*dpr; canvas.height=H*dpr;
canvas.style.width=W+'px'; canvas.style.height=H+'px';
ctx.scale(dpr,dpr);
window.addEventListener('resize',()=>{W=window.innerWidth;H=window.innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);});

// ====================== 参数 ======================
const LINE_HEIGHT=22,FONT_SIZE=14,PADDING=10,BOX_PADDING=8,BOX_SPACING=4,STATUS_BAR_HEIGHT=44;
const BUTTON_HEIGHT=42,BUTTON_WIDTH_RATIO=0.22;
const API_BASE='https://gate-backend-hq8w.onrender.com';
const TYPE_COLORS={system:'#c8b878',battle:'#cc5544',heal:'#88bb88',event:'#ddcc88',inner:'#aa88cc',normal:'#ccc'};

let messages=[],scrollOffset=0;
let playerData=null,currentView='login';
let popupMode=null,popupData=[],popupTitle='',selectedIndex=0;

// ====================== 消息系统 ======================
function addMessage(text,type='normal'){if(!text)return;messages.push({text,type});scrollOffset=0;}
function clearScreen(){messages.length=0;scrollOffset=0;}

// ====================== 绘制 ======================
function drawStatusBar(){
  if(!playerData||currentView!=='main')return;
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,W,STATUS_BAR_HEIGHT);
  ctx.fillStyle='#eee'; ctx.font='bold 14px sans-serif';
  ctx.fillText(`${playerData.species} Lv.${playerData.level}`,12,28);
  const v=playerData.vital||{};
  ctx.font='12px monospace'; ctx.fillStyle='#ccc';
  const str=`❤️${v['生命机能']||100} ⚡${v['体力耐力']||100} 🍖${v['饱腹值']||100} 🧠${v['精神状态']||100}`;
  ctx.fillText(str,W-ctx.measureText(str).width-12,28);
}

function drawButton(x,y,width,label,color){ctx.fillStyle=color;ctx.fillRect(x,y,width,BUTTON_HEIGHT);ctx.strokeStyle='#fff';ctx.strokeRect(x,y,width,BUTTON_HEIGHT);ctx.fillStyle='#000';ctx.font='14px sans-serif';ctx.fillText(label,x+10,y+25);}

function drawMainButtons(){
  if(currentView==='login'){
    const btnW=W*0.3;
    drawButton((W-btnW)/2,H-120,btnW,'新生命','#c8b878');
    drawButton((W-btnW)/2,H-60,btnW,'继续','#c8b878');
    return;
  }
  const btnY1=H-110,btnY2=H-60;
  const btnW=W*BUTTON_WIDTH_RATIO;
  drawButton(20,btnY1,btnW,'探索','#88bb88');
  drawButton(40+btnW,btnY1,btnW,'钓鱼','#88bb88');
  drawButton(60+btnW*2,btnY1,btnW,'战斗','#cc5544');
  drawButton(80+btnW*2,btnY2,btnW,'背包','#ddcc88');
  drawButton(100+btnW*3,btnY2,btnW,'营地','#aa88cc');
  drawButton(120+btnW*3,btnY2,btnW,'地图','#c8b878');
  drawButton(W-80,btnY2,60,'营业','#88bb88');
  drawButton(W-80,10,60,'存档','#c8b878');
}

function drawScreen(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(currentView==='login'){
    ctx.fillStyle='#FFD700'; ctx.font='48px serif'; ctx.textAlign='center';
    ctx.fillText('众生之门',W/2,H/2-40);
    ctx.fillStyle='#D8BFD8'; ctx.font='20px serif';
    ctx.fillText('万物皆玩家，静默求生。',W/2,H/2);
  } else {
    drawStatusBar();
    let y=STATUS_BAR_HEIGHT+4;
    for(let m of messages){
      ctx.fillStyle=TYPE_COLORS[m.type]||TYPE_COLORS.normal;
      ctx.font=FONT_SIZE+'px monospace';
      ctx.textAlign='left';
      ctx.fillText(m.text,PADDING,y);
      y+=LINE_HEIGHT+BOX_SPACING;
    }
  }
  drawMainButtons();
}

// ====================== 核心玩法 ======================
async function callAPI(path,method='GET',body=null){
  try{
    addMessage('【正在唤醒服务器...】','system');
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),20000);
    const res=await fetch(`${API_BASE}${path}`,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):null,signal:controller.signal});
    clearTimeout(timeout);
    return await res.json();
  }catch(e){
    addMessage('【网络延迟，请重试】','system');
    return null;
  }
}

async function newLife(){
  clearScreen();
  addMessage('正在召唤新的生灵...','system');
  drawScreen();
  const res=await callAPI('/player/new_life','POST');
  if(res){
    playerData=res['玩家状态'];
    currentView='main';
    addMessage('✅ 任务完成：初来乍到','heal');
    addMessage('💡 提示：长按按钮有额外功能','system');
    drawScreen();
  }
}

async function explore(){
  if(!playerData)return;
  addMessage('> 你四处探索...','normal');
  drawScreen();
  const pid=playerData.id||'test';
  const res=await callAPI(`/game/explore?player_id=${pid}&map_region=${playerData.current_map||'未知'}`,'POST');
  if(res){
    if(res['获得道具']&&res['获得道具'].length>0){
      const items=res['获得道具'].map(it=>it['道具']);
      addMessage(`你在【${playerData.current_map}】四处探索，发现了一些东西：【${items.join(', ')}】。`,'heal');
      res['获得道具'].forEach(it=>addMessage(`获得：【${it.道具}】（${it.稀有度}）`,'heal'));
    } else addMessage(`你在【${playerData.current_map}】仔细搜寻了一番，但什么也没找到。`,'inner');
  }
  drawScreen();
}

async function fishing(){
  if(!playerData)return;
  addMessage('> 你开始钓鱼...','normal');
  drawScreen();
  const pid=playerData.id||'test';
  const res=await callAPI(`/game/fishing?player_id=${pid}`,'POST');
  if(res){
    if(res['获得道具']) res['获得道具'].forEach(it=>addMessage(`🎣 钓上了：【${it.道具}】`,'heal'));
    if(res['仙女赠予']) res['仙女赠予'].forEach(it=>addMessage(`✨ 仙女赠予：【${it.道具}】`,'heal'));
  }
  drawScreen();
}

async function battle(){
  if(!playerData)return;
  addMessage('> 你警觉地环顾四周...','normal');
  const enemies=['兔','鹿','狐','鼠','蛙','蛇','鹰','狼'];
  const enemy=enemies[Math.floor(Math.random()*enemies.length)];
  addMessage(`前方传来窸窣声响——你看到了一只【${enemy}】！`,'normal');
  addMessage(`突然，那只【${enemy}】猛地向你扑来！`,'battle');
  addMessage('⚠ 你已经击杀了X个同族！再杀就会变成红名...','battle');
  addMessage('✅ 任务完成：初次战斗！经验+50','heal');
  drawScreen();
}

function showInventory(){
  addMessage('> 查看背包','system');
  drawScreen();
  if(playerData&&playerData.inventory&&Object.keys(playerData.inventory).length>0){
    const inv=playerData.inventory;
    const total=Object.values(inv).reduce((a,b)=>a+b,0);
    addMessage(`背包：${Object.keys(inv).length}种，共${total}件`,'normal');
    for(let [item,qty] of Object.entries(inv)) addMessage(`  ${item} x${qty}`,'heal');
  } else addMessage('背包空空如也。','inner');
  drawScreen();
}

function showMap(){
  addMessage('> 查看地图','system');
  addMessage(`📍 当前位置：【${playerData?.current_map||'未知'}】`,'system');
  drawScreen();
}

function showSettlement(){
  addMessage('> 查看营地','system');
  addMessage('你还未建造任何东西。','inner');
  drawScreen();
}

// ====================== 按钮点击 ======================
canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0];handleButtonPress(t.clientX,t.clientY);});
canvas.addEventListener('mouseup',e=>{handleButtonPress(e.clientX,e.clientY);});
function handleButtonPress(x,y){
  const btnW=W*BUTTON_WIDTH_RATIO;
  if(x>=20 && x<=20+btnW && y>=H-110 && y<=H-110+BUTTON_HEIGHT) explore();
  else if(x>=40+btnW && x<=40+btnW*2 && y>=H-110 && y<=H-110+BUTTON_HEIGHT) fishing();
  else if(x>=60+btnW*2 && x<=60+btnW*3 && y>=H-110 && y<=H-110+BUTTON_HEIGHT) battle();
}

// ====================== 初始化 =====================
function init(){clearScreen(); drawScreen();}
init();
</script>
</body>
</html>
