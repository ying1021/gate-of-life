<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>众生之门</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ===== 众生之门 - 网页版客户端 =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const dpr = window.devicePixelRatio || 1;
let W = window.innerWidth;
let H = window.innerHeight;
let popupTime = 0;
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(dpr, dpr);

window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
});

// API地址 — 部署后换成你的服务器地址
const API_BASE = 'https://gate-backend-hq8w.onrender.com';

const LINE_HEIGHT = 20;
const FONT_SIZE = 13;
const PADDING = 10;
const BOX_PADDING = 8;
const BOX_SPACING = 4;
const STATUS_BAR_HEIGHT = 40;

const messages = [];
let scrollOffset = 0;
const MESSAGE_AREA_TOP = STATUS_BAR_HEIGHT + 4;
const MESSAGE_AREA_BOTTOM = H - 72;
const MESSAGE_AREA_HEIGHT = MESSAGE_AREA_BOTTOM - MESSAGE_AREA_TOP;

const TYPE_COLORS = {
  system: '#c8b878', battle: '#cc5544', heal: '#88bb88',
  event: '#ddcc88', inner: '#aa88cc', normal: '#999999',
};

const WATER_MAPS = ['淡水水域', '海水水域', '污水水域', '浅水水域', '湖滨芦苇荡', '跨海长桥', '沉船深海遗迹'];
const STALL_SPECIES = ["人类", "狐", "浣熊", "猩猩", "乌鸦", "兔", "鹿", "羊", "马", "牛", "树懒", "考拉"];

function canStall() {
  if (!playerData) return false;
  return STALL_SPECIES.includes(playerData.species);
}

let playerData = null;
let currentView = 'login';
let popupMode = null;
let popupData = [];
let popupTitle = '';
let selectedIndex = 0;

let touchStartY = 0, touchStartX = 0, isDragging = false;
let longPressTimer = null, isLongPress = false;

let msgGroupId = 0;
function addMessage(text, type = 'normal') {
  if (!text) return;
  const maxWidth = W - PADDING * 2 - BOX_PADDING * 2 - 60;
  const lines = text.split('\n');
  const groupId = msgGroupId++;
  for (let line of lines) {
    while (ctx.measureText(line).width > maxWidth) {
      let low = 1, high = line.length;
      while (low < high) {
        const mid = Math.floor((low + high) / 2);
        if (ctx.measureText(line.substring(0, mid)).width > maxWidth) high = mid;
        else low = mid + 1;
      }
      messages.push({ text: line.substring(0, low - 1), type, group: groupId });
      line = line.substring(low - 1);
    }
    messages.push({ text: line, type, group: groupId });
  }
  scrollOffset = 0;
}

function clearScreen() {
  messages.length = 0;
  scrollOffset = 0;
}

function drawStatusBar() {
  if (!playerData || currentView !== 'main') return;
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, STATUS_BAR_HEIGHT);
  ctx.fillStyle = '#555';
  ctx.fillRect(0, STATUS_BAR_HEIGHT - 1, W, 1);
  const v = playerData.vital;
  ctx.fillStyle = '#eee';
  ctx.font = 'bold 14px sans-serif';
  let nameText = `${playerData.species}  Lv.${playerData.level}`;
  if (playerData.red_name) { nameText += '  🔴'; ctx.fillStyle = '#ff4444'; }
  ctx.fillText(nameText, 12, 28);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#ccc';
  const statsText = `❤️ ${v['生命机能']}  ⚡${v['体力耐力']}  🍖${v['饱腹值']}  🧠${v['精神状态']}`;
  ctx.fillText(statsText, W - ctx.measureText(statsText).width - 12, 28);
}

function drawScreen() {
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, W, H);
  drawStatusBar();
  if (messages.length <= 3 && currentView === 'login') {
    ctx.fillStyle = '#c8b878';
    ctx.font = 'bold 18px sans-serif';
    const title = '众生之门';
    ctx.fillText(title, (W - ctx.measureText(title).width) / 2, H / 2 - 30);
    ctx.fillStyle = '#aa88cc';
    ctx.font = '13px "Courier New", monospace';
    const subtitle = '万物皆玩家，静默求生。';
    ctx.fillText(subtitle, (W - ctx.measureText(subtitle).width) / 2, H / 2);
  }

  let visibleMessages = [];
  let totalMsgHeight = messages.length * (LINE_HEIGHT + BOX_PADDING * 2 + BOX_SPACING);
  let currentY = MESSAGE_AREA_BOTTOM - totalMsgHeight + Math.floor(scrollOffset) * (LINE_HEIGHT + BOX_PADDING * 2 + BOX_SPACING);
  for (let msg of messages) {
    const boxH = BOX_PADDING * 2 + LINE_HEIGHT + BOX_SPACING;
    if (currentY + boxH >= MESSAGE_AREA_TOP && currentY <= MESSAGE_AREA_BOTTOM) {
      visibleMessages.push({ msg, y: currentY });
    }
    currentY += boxH;
  }

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, MESSAGE_AREA_TOP, W, MESSAGE_AREA_HEIGHT);
  ctx.clip();

  let lastGroup = -1;
  let boxStartY = 0;
  let boxLines = [];
  for (let { msg, y } of visibleMessages) {
    if (msg.group !== lastGroup) {
      if (boxLines.length > 0) drawMergedBox(boxLines, boxStartY);
      lastGroup = msg.group;
      boxStartY = y;
      boxLines = [{ msg, y }];
    } else {
      boxLines.push({ msg, y });
    }
  }
  if (boxLines.length > 0) drawMergedBox(boxLines, boxStartY);

  ctx.restore();

  ctx.fillStyle = '#333';
  ctx.fillRect(0, H - 72, W, 1);
  if (scrollOffset > 0) {
    ctx.fillStyle = 'rgba(200,200,200,0.3)';
    ctx.fillRect(W - 6, MESSAGE_AREA_TOP, 4, 20);
  }

  if (currentView === 'login') {
    drawButton(10, H - 50, 80, 35, '新生命', '#1a3a1a');
    drawButton(100, H - 50, 80, 35, '继续', '#1a1a3a');
  } else if (currentView === 'main') {
    const bw = Math.floor((W - 60) / 3);
    const btnH = 30, topY = H - 66, bottomY = H - 32;
    drawButton(15, topY, bw, btnH, '探索', '#2a3a4a');
    drawButton(30 + bw, topY, bw, btnH, '钓鱼', '#2a3a4a');
    drawButton(45 + bw * 2, topY, bw, btnH, '战斗', '#2a3a4a');
    drawButton(15, bottomY, bw, btnH, '背包', '#2a3a4a');
    drawButton(30 + bw, bottomY, bw, btnH, '营地', '#2a3a4a');
    drawButton(45 + bw * 2, bottomY, bw, btnH, '地图', '#2a3a4a');
  }

  if (currentView === 'main' && canStall()) {
    const stallX = W - 50, stallY = MESSAGE_AREA_TOP + 60;
    ctx.fillStyle = '#3a2a1a';
    roundRect(ctx, stallX, stallY, 40, 80, 8);
    ctx.fill();
    ctx.fillStyle = '#ddd';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('营', stallX + 14, stallY + 30);
    ctx.fillText('业', stallX + 14, stallY + 55);
  }
    // 存档按钮
  if (currentView === 'main') {
    const saveX = W - 50;
    const saveY = STATUS_BAR_HEIGHT + 4;
    ctx.fillStyle = '#2a3a1a';
    roundRect(ctx, saveX, saveY, 40, 40, 8);
    ctx.fill();
    ctx.fillStyle = '#ddd';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('存', saveX + 14, saveY + 15);
    ctx.fillText('档', saveX + 14, saveY + 33);
  }
  if (popupMode) drawPopup();
}

function drawMergedBox(lines, startY) {
  if (lines.length === 0) return;
  const boxH = (LINE_HEIGHT + BOX_PADDING * 2) * lines.length + BOX_SPACING * (lines.length - 1);
  let maxTextWidth = 0;
  for (let { msg } of lines) { const tw = ctx.measureText(msg.text).width; if (tw > maxTextWidth) maxTextWidth = tw; }
  const boxW = maxTextWidth + BOX_PADDING * 2;
  const boxX = PADDING;
  ctx.fillStyle = 'rgba(20, 20, 20, 0.85)';
  roundRect(ctx, boxX, startY, boxW, boxH, 6);
  ctx.fill();
  ctx.strokeStyle = TYPE_COLORS[lines[0].msg.type] || TYPE_COLORS.normal;
  ctx.lineWidth = 1;
  roundRect(ctx, boxX, startY, boxW, boxH, 6);
  ctx.stroke();
  for (let i = 0; i < lines.length; i++) {
    ctx.fillStyle = '#d0d0c8';
    ctx.font = FONT_SIZE + 'px "Courier New", monospace';
    ctx.fillText(lines[i].msg.text, boxX + BOX_PADDING, startY + BOX_PADDING + FONT_SIZE + i * (LINE_HEIGHT + BOX_SPACING));
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawButton(x, y, w, h, text, color) {
  ctx.fillStyle = color;
  roundRect(ctx, x, y, w, h, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  const tw = ctx.measureText(text).width;
  ctx.fillText(text, x + (w - tw) / 2, y + h / 2 + 5);
}

function callAPI(path, method = 'GET', body = null) {
  const url = API_BASE + path;
  const options = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) options.body = JSON.stringify(body);
  return Promise.race([
    fetch(url, options).then(res => res.json()),
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4500))
  ]).catch(() => { addMessage('【网络延迟，请重试】', 'system'); return null; });
}

function canFish() {
  if (!playerData) return false;
  const map = playerData.current_map || '';
  let inWater = false;
  for (let wm of WATER_MAPS) { if (map.includes(wm)) { inWater = true; break; } }
  if (!inWater) return { status: false, msg: '这里没有水域，无法钓鱼。' };
  const inv = playerData.inventory || {};
  if (!inv['简易钓竿'] || inv['简易钓竿'] < 1) return { status: false, msg: '你没有钓竿，无法钓鱼。' };
  return { status: true, msg: '' };
}

// ===== 触摸事件 =====
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (popupMode) {
    const touch = e.touches[0];
    const popH = Math.min(H - 100, popupData.length * 36 + 80);
    const popY = (H - popH) / 2;

    const itemIndex = Math.floor((touch.clientY - popY - 55) / 36);
    if (itemIndex >= 0 && itemIndex < popupData.length) {
      popupData[itemIndex].action();
    } else {
      popupMode = null;
      drawScreen();
    }
    return;
  }
  const touch = e.touches[0];
  touchStartY = touch.clientY;
  touchStartX = touch.clientX;
  isDragging = false;
  isLongPress = false;
  longPressTimer = setTimeout(() => { isLongPress = true; handleLongPress(touchStartX, touchStartY); }, 500);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const dy = touch.clientY - touchStartY;
  if (Math.abs(dy) > 5) {
    isDragging = true;
    clearTimeout(longPressTimer);
    if (touchStartY > MESSAGE_AREA_TOP && touchStartY < MESSAGE_AREA_BOTTOM) {
      const boxH = BOX_PADDING * 2 + LINE_HEIGHT + BOX_SPACING;
      const maxScroll = Math.max(0, messages.length - Math.floor(MESSAGE_AREA_HEIGHT / boxH));
      scrollOffset = Math.max(0, Math.min(maxScroll, scrollOffset - dy / boxH));
      drawScreen();
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  clearTimeout(longPressTimer);
  if (!isDragging && !isLongPress) {
    const touch = e.changedTouches[0];
    if (canStall() && touch.clientX > W - 50 && touch.clientY > MESSAGE_AREA_TOP + 60 && touch.clientY < MESSAGE_AREA_TOP + 140) {
      openStallPopup();
      return;
    }
        // 存档按钮
    if (touch.clientX > W - 50 && touch.clientY > STATUS_BAR_HEIGHT + 4 && touch.clientY < STATUS_BAR_HEIGHT + 44) {
      if (playerData) {
        localStorage.setItem('playerData', JSON.stringify(playerData));
        localStorage.setItem('currentView', 'main');
        addMessage('💾 已保存。', 'system');
        drawScreen();
      }
      return;
    }
    if (touch && touch.clientY > H - 72) handleButtonPress(touch.clientX, touch.clientY);
  }
}, { passive: false });

// 桌面端鼠标事件
canvas.addEventListener('mousedown', (e) => {
  if (popupMode) {
    const popH = Math.min(H - 100, popupData.length * 36 + 80);
    const popY = (H - popH) / 2;
    const itemIndex = Math.floor((e.clientY - popY - 55) / 36);
    if (itemIndex >= 0 && itemIndex < popupData.length) {
      popupData[itemIndex].action();
    } else {
      popupMode = null;
      drawScreen();
    }
    return;
  }
  touchStartY = e.clientY;
  touchStartX = e.clientX;
  longPressTimer = setTimeout(() => { isLongPress = true; handleLongPress(touchStartX, touchStartY); }, 500);
});
canvas.addEventListener('mouseup', (e) => {
  clearTimeout(longPressTimer);
  // 存档按钮（鼠标版）
  if (e.clientX > W - 50 && e.clientY > STATUS_BAR_HEIGHT + 4 && e.clientY < STATUS_BAR_HEIGHT + 44) {
    if (playerData) {
      localStorage.setItem('playerData', JSON.stringify(playerData));
      localStorage.setItem('currentView', 'main');
      addMessage('💾 已保存。', 'system');
      drawScreen();
    }
    return;
  }
  if (e.clientY > H - 100) handleButtonPress(e.clientX, e.clientY);
});

function handleLongPress(x, y) {
  if (currentView !== 'main') return;
  const bw = Math.floor((W - 60) / 3);
  const topY = H - 66, bottomY = H - 32, btnH = 30;
  if (y >= topY && y <= topY + btnH) {
    if (x >= 15 && x <= 15 + bw) longPressExplore();
    else if (x >= 30 + bw && x <= 30 + bw * 2) longPressFishing();
    else if (x >= 45 + bw * 2 && x <= 45 + bw * 3) longPressBattle();
  } else if (y >= bottomY && y <= bottomY + btnH) {
    if (x >= 15 && x <= 15 + bw) longPressInventory();
    else if (x >= 30 + bw && x <= 30 + bw * 2) longPressSettlement();
    else if (x >= 45 + bw * 2 && x <= 45 + bw * 3) longPressMap();
  }
}

function handleButtonPress(x, y) {
  const bw = Math.floor((W - 60) / 3);
  const topY = H - 66, bottomY = H - 32, btnH = 30;
  if (currentView === 'login') {
    if (x >= 10 && x <= 90) newLife();
    else if (x >= 100 && x <= 180) loadPlayer();
  } else if (currentView === 'main') {
    if (y >= topY - 15 && y <= topY + btnH + 15) {
      if (x >= 5 && x <= 5 + bw + 10) explore();
      else if (x >= 30 + bw - 5 && x <= 30 + bw * 2 + 5) fishing();
      else if (x >= 45 + bw * 2 - 5 && x <= 45 + bw * 3 + 5) battle();
    } else if (y >= bottomY - 15 && y <= bottomY + btnH + 15) {
      if (x >= 5 && x <= 5 + bw + 10) showInventory();
      else if (x >= 30 + bw - 5 && x <= 30 + bw * 2 + 5) showSettlement();
      else if (x >= 45 + bw * 2 - 5 && x <= 45 + bw * 3 + 5) showMap();
    }
  }
}

function longPressExplore() { addMessage(`📍 当前位置：${playerData?.current_map || '未知'}`, 'system'); drawScreen(); }
function longPressFishing() {
  const fishResult = canFish();
  if (fishResult.status) addMessage('🎣 可以钓鱼，可钓获鱼干、净水等', 'heal');
  else { addMessage(`🎣 ${fishResult.msg}`, 'inner'); addMessage('去湖滨芦苇荡或老城区巷弄的商店购买钓竿吧。', 'inner'); }
  drawScreen();
}

async function longPressBattle() {
  if (!playerData) return;
  popupTitle = '战斗选项';
  popupData = [
    {
      label: '查看红名状态',
      action: async () => {
       
        const pid = playerData?.id || 'test';
        const result = await callAPI(`/player/red_name?player_id=${pid}`, 'GET');
        if (result) {
          addMessage(`⚔ Lv.${playerData.level} ${playerData.species}`, 'system');
          addMessage(`同族击杀数：${result['同大类击杀数']}`, result['is_red_name'] ? 'battle' : 'normal');
          if (result['is_red_name']) { addMessage('🔴 你是红名玩家！', 'battle'); addMessage(`忏悔进度：${result['忏悔进度']}`, 'inner'); }
        }
        drawScreen();
      }
    },
    {
      label: '自我了断（重头再来）',
      action: () => {
        popupTitle = '确认重来？';
        popupData = [
          {
            label: '确定重来（数据将全部清空）',
            action: async () => {
              localStorage.removeItem('playerData');
              localStorage.removeItem('currentView');
              const pid = playerData?.id || 'test';
              const result = await callAPI(`/player/suicide?player_id=${pid}`, 'POST');
              if (result) {
                addMessage(result['叙事文字'] || result.msg, 'battle');
                playerData = null;
                currentView = 'login';
              }
              popupMode = null;
              drawScreen();
            }
          },
          { label: '取消', action: () => { popupMode = null; drawScreen(); } }
        ];
        selectedIndex = 0;
        popupMode = 'confirm_suicide';
        drawScreen();
      }
    },
        {
      label: '查看天赋与专精',
      action: () => {
        if (!playerData) return;
        addMessage(`【天赋】${playerData.talent || '无'}`, 'inner');
        addMessage(`【等级】Lv.${playerData.level}`, 'normal');
        const specPoints = Math.floor((playerData.level || 1) / 5);
        addMessage(`【可用专精点】${specPoints}`, 'normal');
        // 弹出可分配专精
        if (specPoints > 0) {
          popupTitle = '分配专精';
          const specs = ['气候抗性', '水域适应', '体质强化', '生态适应', '生存博弈', '野外捕猎'];
          popupData = specs.map(spec => ({
            label: spec,
            action: async () => {
              const pid = playerData?.id || 'test';
              const r = await callAPI(`/player/allocate_spec?player_id=${pid}&spec_name=${spec}&level=${playerData.level}`, 'POST');
              if (r) addMessage(r['msg'], r['成功'] ? 'heal' : 'inner');
              drawScreen();
            }
          }));
          popupData.push({ label: '关闭', action: () => { popupMode = null; drawScreen(); } });
          selectedIndex = 0; popupMode = 'alloc_spec';
          drawScreen();
        }
      }
    },
    { label: '关闭', action: () => { popupMode = null; drawScreen(); } }
  ];
  selectedIndex = 0;
  popupMode = 'battle_menu';
  drawScreen();
}

async function longPressSettlement() {
  if (!playerData) return;
  const map = playerData.current_map || '城郊青草地';
  const pid = playerData?.id || 'test';
   const shopResult = await callAPI(`/shop/info?map_region=${map}&player_id=${pid}`, 'GET');
  if (shopResult && shopResult['有商店'] && shopResult['商店列表'].length > 0) {
    const items = [];
    for (let shop of shopResult['商店列表']) {
      for (let item of shop['商品']) {
        items.push({
          label: `[${shop['商店名']}] ${item['名称']}（${item['价格']}）`,
          action: async () => {
            const buyResult = await callAPI(`/shop/buy?map_region=${map}&shop_name=${shop['商店名']}&item_name=${item['名称']}`, 'POST');
            if (buyResult) {
              addMessage(buyResult['msg'], buyResult['成功'] ? 'heal' : 'inner');
              if (buyResult['成功'] && playerData) {
                if (!playerData.inventory) playerData.inventory = {};
                playerData.inventory[buyResult['获得']] = (playerData.inventory[buyResult['获得']] || 0) + 1;
                const pp = buyResult['付出'].split('x');
                if (pp.length === 2 && playerData.inventory[pp[0]]) { playerData.inventory[pp[0]] -= parseInt(pp[1]); if (playerData.inventory[pp[0]] <= 0) delete playerData.inventory[pp[0]]; }
              }
            }
            drawScreen();
          }
        });
      }
    }
    items.push({ label: '关闭', action: () => { popupMode = null; drawScreen(); } });
    popupTitle = `购物（${map}）`;
    popupData = items; selectedIndex = 0; 
    popupTime = Date.now(); 
    popupMode = 'shop_buy';
    drawScreen();
  } else { addMessage('这里没有商店。', 'inner'); drawScreen(); }
}

async function newLife() {
  clearScreen();
  addMessage('正在召唤新的生灵...', 'system');
  drawScreen();
  const result = await callAPI('/player/new_life', 'POST');
  if (result) {
    playerData = result['玩家状态'];
    const narrative = result['叙事文字'] || result.msg;
    if (narrative) narrative.split('\n').forEach(line => { if (line.trim()) addMessage(line, 'system'); });
        currentView = 'main';
    // 本地存档
    localStorage.setItem('playerData', JSON.stringify(playerData));
    localStorage.setItem('currentView', 'main');
    if (!playerData.quests) playerData.quests = {};
    playerData.quests['初来乍到'] = { '完成': true, '进度': 1 };
    addMessage('✅ 任务完成：初来乍到', 'heal');
    addMessage('💡 提示：长按按钮有额外功能', 'system');
  }
  drawScreen();
}
async function loadPlayer() {
  const saved = localStorage.getItem('playerData');
  if (saved) {
    playerData = JSON.parse(saved);
    currentView = 'main';
    addMessage('你回来了。', 'system');
    drawScreen();
  } else {
    addMessage('没有存档。点击"新生命"开始吧。', 'inner');
    drawScreen();
  }
}
async function explore() {
  if (!playerData) return;
  addMessage('> 你四处探索...', 'normal');
  drawScreen();
  const pid = playerData.id || 'test';
  const result = await callAPI(`/game/explore?player_id=${pid}&map_region=${playerData.current_map || '城郊青草地'}`, 'POST');
  if (result) {
    addMessage(result['叙事'], 'normal');
    (result['获得道具'] || []).forEach(item => {
      addMessage(`获得：${item['道具']}（${item['稀有度']}）`, 'heal');
      if (!playerData.inventory) playerData.inventory = {};
      playerData.inventory[item['道具']] = (playerData.inventory[item['道具']] || 0) + 1;
    });
  }
  const eventResult = await callAPI(`/game/random_event?player_id=${pid}&map_region=${playerData.current_map || '城郊青草地'}&weather_str=晴天`, 'POST');
  if (eventResult && eventResult['触发']) {
    addMessage('✨ ' + eventResult['叙事'], 'event');
    (eventResult['获得道具'] || []).forEach(item => {
      addMessage(`获得：${item['道具']}（${item['稀有度']}）`, 'heal');
      if (!playerData.inventory) playerData.inventory = {};
      playerData.inventory[item['道具']] = (playerData.inventory[item['道具']] || 0) + 1;
    });
  }
  if (!playerData.quests) playerData.quests = {};
  if (!playerData.quests['初次探索'] || !playerData.quests['初次探索']['完成']) {
    playerData.quests['初次探索'] = playerData.quests['初次探索'] || { '完成': false, '进度': 0 };
    playerData.quests['初次探索']['进度']++;
    if (playerData.quests['初次探索']['进度'] >= 1 && !playerData.quests['初次探索']['完成']) {
      playerData.quests['初次探索']['完成'] = true;
      playerData.exp = (playerData.exp || 0) + 20;
      addMessage('✅ 任务完成：初次探索！经验+20', 'heal');
    }
  }
  drawScreen();
}
async function fishing() {
  if (!playerData) return;
  const fishResult = canFish();
  if (!fishResult.status) { addMessage(`> ${fishResult.msg}`, 'system'); addMessage('请在商店购买简易钓竿后再来。', 'inner'); drawScreen(); return; }
  addMessage('> 你开始钓鱼...', 'normal');
  drawScreen();
  const pid = playerData.id || 'test';
  const result = await callAPI(`/game/fishing?player_id=${pid}&map_region=湖滨芦苇荡`, 'POST');
  if (result) {
    addMessage(result['叙事'], 'event');
    (result['获得道具'] || []).forEach(item => {
      addMessage(`🎣 钓上了：${item['道具']}`, 'heal');
      if (!playerData.inventory) playerData.inventory = {};
      playerData.inventory[item['道具']] = (playerData.inventory[item['道具']] || 0) + 1;
    });
    if (result['需要选择']) {
      addMessage('仙女等待你的回答...', 'inner');
      const cr = await callAPI('/game/fairy_choice?choice=铁斧头', 'POST');
      if (cr) {
        addMessage(cr['结果'], 'event');
        (cr['获得道具'] || []).forEach(item => { addMessage(`✨ 仙女赠予：${item['道具']}`, 'heal'); playerData.inventory[item['道具']] = (playerData.inventory[item['道具']] || 0) + 1; });
      }
    }
  }
  drawScreen();
}
function showInventory() {
  addMessage('> 查看背包', 'system');
  drawScreen();
  if (playerData && playerData.inventory && Object.keys(playerData.inventory).length > 0) {
    const inv = playerData.inventory;
    const total = Object.values(inv).reduce((a, b) => a + b, 0);
    addMessage(`背包：${Object.keys(inv).length}种，共${total}件`, 'normal');
    for (let [item, qty] of Object.entries(inv)) addMessage(`  ${item} x${qty}`, 'heal');
  } else { addMessage('背包空空如也。', 'inner'); }
  if (playerData && playerData.inventory && !playerData.quests) playerData.quests = {};
  if (playerData && playerData.quests && (!playerData.quests['收集物资'] || !playerData.quests['收集物资']['完成'])) {
    const itemTypes = Object.keys(playerData.inventory || {}).length;
    if (itemTypes >= 3) { playerData.quests['收集物资'] = { '完成': true, '进度': 3 }; playerData.inventory['净水'] = (playerData.inventory['净水'] || 0) + 2; addMessage('✅ 任务完成：收集物资！净水+2', 'heal'); }
  }
  drawScreen();
}
async function longPressInventory() {
  if (!playerData) return;
  const pid = playerData?.id || 'test';
  const result = await callAPI(`/inventory/view?player_id=${pid}`, 'GET');
  if (result && result['背包'] && Object.keys(result['背包']).length > 0) {
    const items = [];
    for (let [itemName, qty] of Object.entries(result['背包'])) {
      items.push({ label: `${itemName} x${qty}`, action: async () => {
        const useResult = await callAPI(`/inventory/use?item_name=${itemName}`, 'POST');
        if (useResult && useResult['成功']) { addMessage(useResult['msg'], 'heal'); if (useResult['应用效果']) for (let [stat, value] of Object.entries(useResult['应用效果'])) addMessage(`  ${stat}: ${value}`, 'heal'); }
        else if (useResult) addMessage(useResult['msg'], 'inner');
        drawScreen();
      }});
    }
    items.push({ label: '关闭', action: () => { popupMode = null; drawScreen(); } });
    popupTitle = '使用道具'; popupData = items; selectedIndex = 0; popupMode = 'item_use';
    drawScreen();
  } else { addMessage('背包空空如也。', 'inner'); drawScreen(); }
}
async function showSettlement() {
  addMessage('> 查看营地', 'system');
  drawScreen();
  const pid = playerData?.id || 'test';
  const result = await callAPI(`/settlement/view?player_id=${pid}`, 'GET');
  if (result) {
    if (result['建筑数量'] === 0) addMessage('你还未建造任何东西。', 'inner');
    else { addMessage(result.msg, 'normal'); (result['建筑列表'] || []).forEach(b => addMessage(`  🏕 ${b}`, 'heal')); }
  }
  drawScreen();
}
async function showBuild() {
  addMessage('> 建造系统', 'system');
  addMessage('简易营地：木材x5 藤绳x2 石块x3', 'normal');
  drawScreen();
  const pid = playerData?.id || 'test';
  const result = await callAPI(`/settlement/build?building_str=简易营地&player_id=${pid}`, 'POST');
  if (result) {
    addMessage(result['叙事'] || result.msg, 'heal');
    if (!result['成功']) addMessage('材料不足，请先探索收集材料。', 'inner');
    else {
      if (!playerData.quests) playerData.quests = {};
      if (!playerData.quests['安营扎寨'] || !playerData.quests['安营扎寨']['完成']) {
        playerData.quests['安营扎寨'] = { '完成': true, '进度': 1 };
        playerData.inventory['木材'] = (playerData.inventory['木材'] || 0) + 5;
        addMessage('✅ 任务完成：安营扎寨！木材+5', 'heal');
      }
    }
  }
  drawScreen();
}
async function showMap() {
  addMessage('> 查看地图', 'system');
  drawScreen();
  const map = playerData?.current_map || '城郊青草地';
  addMessage(`📍 当前位置：${map}`, 'system');
  const result = await callAPI(`/map/moves?player_id=${playerData?.id || 'test'}&map_region=${map}`, 'GET');
  if (result && result['可前往'] && result['可前往'].length > 0) {
    addMessage('--- 可前往 ---', 'normal');
    for (let dest of result['可前往']) {
      const displayName = dest['已探索'] ? dest['名称'] : '???';
      if (dest['已探索']) {
        const shopResult = await callAPI(`/shop/info?map_region=${dest['名称']}`, 'GET');
        let shopInfo = shopResult && shopResult['有商店'] ? `  🏪 x${shopResult['商店数量']}` : '';
        addMessage(`  → ${displayName}${shopInfo}`, 'heal');
      } else { addMessage(`  → ${displayName}（未探索）`, 'normal'); }
    }
  }
  drawScreen();
}
async function longPressMap() {
  if (!playerData) return;
  const map = playerData.current_map || '城郊青草地';
  const result = await callAPI(`/map/moves?player_id=${playerData?.id || 'test'}&map_region=${map}`, 'GET');
  if (!result || !result['可前往'] || result['可前往'].length === 0) { addMessage('没有可前往的其他地图。', 'inner'); drawScreen(); return; }
  const destinations = result['可前往'];
  popupTitle = '前往何处？';
  popupData = destinations.map(dest => ({
    label: dest['已探索'] ? dest['名称'] : `???（${dest['真实名称']}方向）`,
    action: function() {
      const target = dest['已探索'] ? dest['名称'] : dest['真实名称'];
      popupTitle = `前往 ${target}？`;
      popupData = [
        { label: '确定（消耗体力、饱腹、心神）', action: async function() {
          const mr = await callAPI(`/map/move?player_id=${playerData?.id || 'test'}&target_map=${target}`, 'POST');
          if (mr['成功'] && playerData && playerData.vital) {
              playerData.current_map = mr['当前地图'];
            if (mr['成功'] && playerData && playerData.vital) {
              playerData.vital['体力耐力'] = Math.max(0, (playerData.vital['体力耐力'] || 100) - 8);
              playerData.vital['饱腹值'] = Math.max(0, (playerData.vital['饱腹值'] || 100) - 5);
              playerData.vital['精神状态'] = Math.max(0, (playerData.vital['精神状态'] || 100) - 3);
            }
          }
          popupMode = null; drawScreen();
        }},
        { label: '取消', action: function() { popupMode = null; drawScreen(); } }
      ];
      selectedIndex = 0; popupMode = 'confirm_move'; drawScreen();
    }
  }));
   popupData.push({ label: '取消', action: () => { popupMode = null; drawScreen(); } });
  selectedIndex = 0; popupMode = 'map_move'; drawScreen();
}
function weightedRandom(weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i; }
  return weights.length - 1;
}
async function battle() {
  if (!playerData) return;
  const enemies = ['兔', '鹿', '狐', '鼠', '蛙', '蛇', '鹰', '狼'];
  const enemy = enemies[Math.floor(Math.random() * enemies.length)];
  addMessage('> 你警觉地环顾四周...', 'normal'); drawScreen();
  addMessage(`前方传来窸窣声响——你看到了一只${enemy}！`, 'normal'); drawScreen();
  const reaction = ['attack', 'flee', 'ignore'][weightedRandom([0.5, 0.3, 0.2])];
  if (reaction === 'flee') { addMessage(`那只${enemy}转身逃走了。`, 'inner'); drawScreen(); return; }
  if (reaction === 'ignore') { addMessage(`那只${enemy}瞥了你一眼，继续做自己的事。`, 'inner'); drawScreen(); return; }
  const attackDescs = [`突然，那只${enemy}猛地向你扑来！`, `${enemy}发出低沉的威胁声，朝你冲了过来！`, `毫无征兆地，${enemy}从侧面发起了突袭！`];
  addMessage(attackDescs[Math.floor(Math.random() * attackDescs.length)], 'battle'); drawScreen();
  const result = await callAPI(`/game/battle?attacker_species=${playerData.species}&defender_species=${enemy}&attacker_level=${playerData.level}`, 'POST');
  if (result) {
        const battleDesc = result['战斗描述']
      .replace(/skin_laceration/g, '皮肉撕裂')
      .replace(/fracture/g, '骨折')
      .replace(/blood_loss/g, '失血')
      .replace(/poison/g, '中毒')
      .replace(/asphyxia/g, '窒息')
      .replace(/frostbite/g, '冻伤')
      .replace(/burn/g, '灼伤')
      .replace(/sensory_damage/g, '感官受损');
    addMessage(battleDesc, 'battle');
      if (playerData && playerData.vital) {
      playerData.vital['生命机能'] = Math.max(0, (playerData.vital['生命机能'] || 100) - (result['防御方造成效果']['受到伤害'] || 0));
      playerData.vital['体力耐力'] = Math.max(0, (playerData.vital['体力耐力'] || 100) - (result['防御方造成效果']['受到伤害'] || 0) * 0.3);
    }
    addMessage(`你造成了 ${result['攻击方造成效果']['受到伤害']} 点伤害，受到了 ${result['防御方造成效果']['受到伤害']} 点伤害`, 'battle');
    if (Math.random() < 0.3) {
      const redResult = await callAPI('/player/red_name', 'GET');
      if (redResult && redResult['同大类击杀数'] >= 14) addMessage(`⚠ 你已经击杀了 ${redResult['同大类击杀数']} 个同族！再杀就会变成红名...`, 'battle');
    }
  }
  if (!playerData.quests) playerData.quests = {};
  if (!playerData.quests['初次战斗'] || !playerData.quests['初次战斗']['完成']) {
    playerData.quests['初次战斗'] = playerData.quests['初次战斗'] || { '完成': false, '进度': 0 };
    playerData.quests['初次战斗']['进度']++;
    if (playerData.quests['初次战斗']['进度'] >= 1 && !playerData.quests['初次战斗']['完成']) { playerData.quests['初次战斗']['完成'] = true; playerData.exp = (playerData.exp || 0) + 50; addMessage('✅ 任务完成：初次战斗！经验+50', 'heal'); }
  }
  drawScreen();
}
async function init() {
  clearScreen();
  const hasSave = localStorage.getItem('playerData');
  if (hasSave) {
    currentView = 'login';
  } else {
    currentView = 'login';
  }
  const result = await callAPI('/');
  if (result) addMessage(result.message, 'system');
  drawScreen();
}

function drawPopup() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
  const popW = W - 40; const popH = Math.min(H - 100, popupData.length * 36 + 80);
  const popX = 20, popY = (H - popH) / 2;
  ctx.fillStyle = '#1a1a2e'; roundRect(ctx, popX, popY, popW, popH, 10); ctx.fill();
  ctx.strokeStyle = '#555'; ctx.lineWidth = 2; roundRect(ctx, popX, popY, popW, popH, 10); ctx.stroke();
  ctx.fillStyle = '#c8b878'; ctx.font = 'bold 15px sans-serif'; ctx.fillText(popupTitle, popX + 15, popY + 30);
  ctx.font = '13px sans-serif';
  for (let i = 0; i < popupData.length; i++) {
    const itemY = popY + 55 + i * 36;
    if (i === selectedIndex) { ctx.fillStyle = '#2a4a6a'; roundRect(ctx, popX + 10, itemY - 5, popW - 20, 30, 5); ctx.fill(); }
    ctx.fillStyle = '#ddd'; ctx.fillText(popupData[i].label, popX + 20, itemY + 17);
  }
  ctx.fillStyle = '#888'; ctx.font = '11px sans-serif'; ctx.fillText('点击选择', popX + 15, popY + popH - 15);
}
async function openStallPopup() {
  if (!playerData) return;
  const map = playerData.current_map || '城郊青草地';
  const shopResult = await callAPI(`/shop/info?map_region=${map}`, 'GET');
  if (!shopResult || !shopResult['有商店']) { addMessage('这里没有商店，无法营业。', 'inner'); drawScreen(); return; }
  popupTitle = '商店营业';
  popupData = [
    { label: '开启营业（挂出野果x2 → 石块x1）', action: async () => { const r = await callAPI('/stall/open', 'POST'); if (r) addMessage(r['msg'], r['成功'] ? 'heal' : 'inner'); drawScreen(); } },
    { label: '关闭营业', action: async () => { const r = await callAPI('/stall/close', 'POST'); if (r) addMessage(r['msg'], r['成功'] ? 'heal' : 'inner'); drawScreen(); } }
  ];
  selectedIndex = 0; popupMode = 'stall'; drawScreen();
}
init();
