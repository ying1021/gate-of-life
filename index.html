<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>众生之门</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; touch-action:none; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
let W = window.innerWidth, H = window.innerHeight;
canvas.width = W * dpr; canvas.height = H * dpr;
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
ctx.scale(dpr, dpr);
window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
});

let playerData = null, currentView = 'login';
let popupMode = null, popupData = [], popupTitle = '', selectedIndex = 0;
let touchStartY = 0, touchStartX = 0, isDragging = false, longPressTimer = null, isLongPress = false;
</script>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/uiMessages.js"></script>
<script src="js/canvasRenderer.js"></script>
<script src="js/playerActions.js"></script>
<script src="js/inputHandler.js"></script>

<script>
async function init() {
  clearScreen();
  const result = await API.healthCheck();
  if (result) addMessage(result.message, 'system');
  buildMainButtons();
  drawScreen();
}
init();
</script>
</body>
</html>
