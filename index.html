<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>众生之门 - 完整离线+同步+事件选择版</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; touch-action:none; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ===== 众生之门 完整版 =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;
const dpr = window.devicePixelRatio||1;
canvas.width = W*dpr; canvas.height = H*dpr;
canvas.style.width = W+'px'; canvas.style.height = H+'px';
ctx.scale(dpr,dpr);
window.addEventListener('resize',()=>{
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
});

// ===== 游戏参数 =====
const LINE_HEIGHT=20, FONT_SIZE=13, PADDING=10, BOX_PADDING=8, BOX_SPACING=4, STATUS_BAR_HEIGHT=40;
const TYPE_COLORS={system:'#c8b878', battle:'#cc5544', heal:'#88bb88', event:'#ddcc88', inner:'#aa88cc', normal:'#999'};
const BUTTON_HEIGHT=30, BUTTON_WIDTH=100, BUTTON_MARGIN=10;
const STALL_SPECIES=["人类","狐","浣熊","猩猩","乌鸦","兔","鹿","羊","马","牛","树懒","考拉"];
const MOCK_MAPS=['老城区巷弄','湖滨芦苇荡','沉船深海遗迹','城郊青草地'];
const RANDOM_EVENTS=[
  { '叙事':'你发现一处废弃仓库，里面有一些干粮。',
    '选项':[ { 'label':'拿干粮','结果':{'获得道具':[{'道具':'干粮','稀有度':'普通'}]} },
             { 'label':'不管它','结果':{'获得道具':[]}} ]
  },
  { '叙事':'路上遇到一只迷路的小鹿，你救了它并获得净水。',
    '选项':[ { 'label':'救它','结果':{'获得道具':[{'道具':'净水','稀有度':'普通'}]} },
             { 'label':'不管它','结果':{'获得道具':[]}} ]
  },
  { '叙事':'仙女出现，等待你的回答。',
    '选项':[ { 'label':'接受礼物','结果':{'获得道具':[{'道具':'草药','稀有度':'稀有'}]} },
             { 'label':'拒绝','结果':{'获得道具':[]}} ]
  }
];

// ===== 游戏状态 =====
let messages=[], scrollOffset=0;
let playerData=null, currentView='login';
let popupMode=null, popupData=[], popupTitle='', selectedIndex=0;
let syncQueue=[];

// ===== 本地模拟数据 =====
const MOCK_INVENTORY={'干粮':3,'净水':2,'简易钓竿':1};
const MOCK_SHOPS=[{ '商店名':'老城区杂货铺','商品':[{'名称':'干粮','价格':2},{'名称':'净水','价格':1},{'名称':'简易钓竿','价格':5}] }];

// ===== 辅助函数 =====
function addMessage(text,type='normal'){ if(!text)return; messages.push({text,type}); scrollOffset=0; }
function clearScreen(){ messages.length=0; scrollOffset=0; }
function drawStatusBar(){
    if(!playerData||currentView!=='main')return;
    ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,W,STATUS_BAR_HEIGHT);
    ctx.fillStyle='#eee'; ctx.font='bold 14px sans-serif';
    ctx.fillText(`${playerData.species} Lv.${playerData.level}`,12,28);
    const v=playerData.vital;
    ctx.font='12px monospace'; ctx.fillStyle='#ccc';
    ctx.fillText(`❤️ ${v['生命机能']} ⚡${v['体力耐力']} 🍖${v['饱腹值']} 🧠${v['精神状态']}`,W-ctx.measureText(`❤️ ${v['生命机能']} ⚡${v['体力耐力']} 🍖${v['饱腹值']} 🧠${v['精神状态']}`).width-12,28);
}

// ===== 弹窗绘制 =====
function drawPopup(){
    if(!popupMode||!popupData||popupData.length===0) return;
    const boxW=W-40, boxH=LINE_HEIGHT*(popupData.length+2)+BOX_PADDING*2;
    const x=20, y=(H-boxH)/2;
    ctx.fillStyle='#222'; ctx.fillRect(x,y,boxW,boxH);
    ctx.strokeStyle='#fff'; ctx.strokeRect(x,y,boxW,boxH);
    ctx.fillStyle='#fff'; ctx.font=FONT_SIZE+'px monospace';
    ctx.fillText(popupTitle,x+BOX_PADDING,y+BOX_PADDING+FONT_SIZE);
    for(let i=0;i<popupData.length;i++){
        ctx.fillStyle=(i===selectedIndex)?'#88bb88':'#ccc';
        ctx.fillText(popupData[i].label,x+BOX_PADDING,y+BOX_PADDING+FONT_SIZE+(i+1)*LINE_HEIGHT);
    }
}

// ===== 绘制界面 =====
function drawScreen(){
    ctx.fillStyle='#0d0d0d'; ctx.fillRect(0,0,W,H);
    drawStatusBar();
    let y=STATUS_BAR_HEIGHT+4;
    for(let m of messages){ ctx.fillStyle=TYPE_COLORS[m.type]||TYPE_COLORS.normal; ctx.font=FONT_SIZE+'px monospace'; ctx.fillText(m.text,PADDING,y); y+=LINE_HEIGHT+BOX_SPACING; }
    drawPopup();
}

// ===== 离线+同步API =====
const API_BASE='https://gate-backend-hq8w.onrender.com';
async function callAPI(path,method='GET',body=null){
    await new Promise(r=>setTimeout(r,100));
    if(path.startsWith('/inventory/view')) return {'背包':{...MOCK_INVENTORY}};
    if(path.startsWith('/inventory/use')){
        const item=body?.item_name;
        if(MOCK_INVENTORY[item]>0){ MOCK_INVENTORY[item]--; return {'成功':true,'msg':`使用了 ${item}`,'应用效果':{'体力':5}}; }
        return {'成功':false,'msg':`${item} 不存在`};
    }
    if(path.startsWith('/shop/info')) return {'有商店':true,'商店列表':MOCK_SHOPS,'商店数量':MOCK_SHOPS.length};
    if(path.startsWith('/shop/buy')){ const { item_name }=body; MOCK_INVENTORY[item_name]=(MOCK_INVENTORY[item_name]||0)+1; return {'成功':true,'msg':`购买了 ${item_name}`,'获得':item_name,'付出':'干粮x1'}; }
    if(path.startsWith('/game/explore')) return {'叙事':'你四处探索发现了资源。','获得道具':[{'道具':'木材','稀有度':'普通'}]};
    if(path.startsWith('/game/random_event')) return RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)];
    if(path.startsWith('/map/moves')) return {'可前往': MOCK_MAPS.map(m=>({已探索:true,名称:m,真实名称:m}))};
    if(path.startsWith('/map/move')) return {'成功':true,'当前地图':body?.target_map||'未知'};
    if(path.startsWith('/game/fishing')) return {'叙事':'钓鱼中','获得道具':[{'道具':'鱼干'}]};
    if(path.startsWith('/game/battle')) return {'攻击方造成效果':{'受到伤害':5},'防御方造成效果':{'受到伤害':3},'战斗描述':'敌人攻击你，造成伤害。'};
    if(path.startsWith('/player/new_life')) return {'玩家状态':{'id':'test','species':'人类','level':1,'vital':{'生命机能':100,'体力耐力':100,'饱腹值':100,'精神状态':100},'inventory':{...MOCK_INVENTORY}},'叙事文字':'你诞生了新的生灵。'};
    return {'msg':'模拟响应'};
}

// ===== 同步队列 =====
function addSyncTask(task){ syncQueue.push(task); attemptSync(); }
async function attemptSync(){
    if(!navigator.onLine||syncQueue.length===0) return;
    const queueCopy=[...syncQueue];
    for(let task of queueCopy){
        try{
            let res=null;
            if(task.type==='use_item'){ res=await fetch(`${API_BASE}/inventory/use`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_name:task.item})}); res=await res.json();}
            else if(task.type==='explore'){ res=await fetch(`${API_BASE}/game/explore`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({map_region:task.map})}); res=await res.json();}
            syncQueue.splice(syncQueue.indexOf(task),1);
            console.log('[同步成功]',task,res);
        }catch(err){ console.log('[同步失败]',task,err);}
    }
}

// ===== 随机事件选择弹窗 =====
function triggerRandomEvent(){
    const eventRes = RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)];
    if(!eventRes) return;

    popupTitle = '随机事件';
    popupData = eventRes.选项.map(opt=>({label:opt.label, action:()=>{ 
        (opt.结果.获得道具||[]).forEach(it=>{
            addMessage(`获得：${it.道具}`,'heal');
            playerData.inventory[it.道具]=(playerData.inventory[it.道具]||0)+1;
        });
        popupMode=null; popupData=[]; drawScreen();
    }}));
    popupMode='event_choice';
    addMessage(eventRes.叙事,'event');
    drawScreen();
}

// ===== 游戏操作 =====
async function explore(){
    if(!playerData) return;
    addMessage('> 你四处探索...','normal'); drawScreen();

    const res = await callAPI(`/game/explore?player_id=${playerData.id}`,'POST');
    if(res){
        addMessage(res['叙事'],'normal');
        (res['获得道具']||[]).forEach(it=>{
            addMessage(`获得：${it['道具']}`,'heal');
            playerData.inventory[it['道具']] = (playerData.inventory[it['道具']]||0)+1;
        });
    }

    // 随机事件弹窗
    triggerRandomEvent();
    addSyncTask({type:'explore',map:playerData.current_map||'未知',timestamp:Date.now()});
}

function showInventory(){
    addMessage('> 查看背包','system'); drawScreen();
    if(playerData&&playerData.inventory){
        for(let [item,qty] of Object.entries(playerData.inventory)){
            addMessage(`  ${item} x${qty}`,'heal');
        }
    }
}

// ===== 初始化 =====
async function newLife(){ clearScreen(); addMessage('正在召唤新的生灵...','system'); drawScreen(); const res=await callAPI('/player/new_life','POST'); if(res){ playerData=res['玩家状态']; playerData.current_map=MOCK_MAPS[0]; currentView='main'; addMessage(res['叙事文字'],'system'); drawScreen(); } }
function init(){ clearScreen(); addMessage('众生之门 完整离线+同步+事件选择版','system'); drawScreen(); }
init();

// ===== 触摸/鼠标 =====
canvas.addEventListener('touchend',e=>{ handleButtonPress(e.changedTouches[0].clientX,e.changedTouches[0].clientY); });
canvas.addEventListener('mouseup',e=>{ handleButtonPress(e.clientX,e.clientY); });

function handleButtonPress(x,y){
    if(currentView==='login'){newLife();return;}
    if(currentView==='main'){
        if(popupMode==='event_choice'){
            // 简单点击第一个选项处理
            if(popupData && popupData[0] && popupData[0].action) popupData[0].action();
            return;
        }
        if(y>H-66 && y<H-32){ explore(); return; }
        if(y>H-32){ showInventory(); return; }
    }
}
</script>
</body>
</html>
