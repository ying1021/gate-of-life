<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>众生之门 - 最终可玩版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;touch-action:none;}
canvas{display:block;}
button{display:none;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ====================== 全局变量 ======================
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let W=window.innerWidth,H=window.innerHeight;
const dpr=window.devicePixelRatio||1;
canvas.width=W*dpr; canvas.height=H*dpr;
canvas.style.width=W+'px'; canvas.style.height=H+'px';
ctx.scale(dpr,dpr);
window.addEventListener('resize',()=>{W=window.innerWidth;H=window.innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);});

// ====================== 参数 ======================
const LINE_HEIGHT=22,FONT_SIZE=14,PADDING=10,BOX_PADDING=8,BOX_SPACING=4,STATUS_BAR_HEIGHT=44;
const TYPE_COLORS={system:'#c8b878',battle:'#cc5544',heal:'#88bb88',event:'#ddcc88',inner:'#aa88cc',normal:'#ccc'};
const BUTTON_HEIGHT=42,BUTTON_WIDTH_RATIO=0.22;
const API_BASE='https://gate-backend-hq8w.onrender.com';
let messages=[],scrollOffset=0;
let playerData=null,currentView='welcome';
let popupMode=null,popupData=[],popupTitle='',selectedIndex=0;
let syncQueue=[];
let welcomeOptions=['新生命','继续'];
const MOCK_MAPS=['老城区巷弄','湖滨芦苇荡','沉船深海遗迹','城郊青草地'];
const RANDOM_EVENTS=[
  {'叙事':'你发现一处废弃仓库，里面有一些干粮。','选项':[{'label':'拿干粮','结果':{'获得道具':[{'道具':'干粮','稀有度':'普通'}]}},{'label':'不管它','结果':{'获得道具':[]}}]},
  {' 事':'路上遇到一只迷路的小鹿，你救了它并获得净水。','选项':[{'label':'救它','结果':{'获得道具':[{'道具':'净水','稀有度':'普通'}]}},{'label':'不管它','结果':{'获得道具':[]}}]},
  {'叙事':'仙女出现，等待你的回答。','选项':[{'label':'接受礼物','结果':{'获得道具':[{'道具':'草药','稀有度':'稀有'}]}},{'label':'拒绝','结果':{'获得道具':[]}}]}
];

// ====================== 消息系统 ======================
function addMessage(text,type='normal'){if(!text)return;messages.push({text,type});scrollOffset=0;}
function clearScreen(){messages.length=0;scrollOffset=0;}

// ====================== 绘制 ======================
function drawStatusBar(){
  if(!playerData||currentView!=='main')return;
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,W,STATUS_BAR_HEIGHT);
  ctx.fillStyle='#eee'; ctx.font='bold 14px sans-serif';
  ctx.fillText(`${playerData.species} Lv.${playerData.level}`,12,28);
  const v=playerData.vital;
  ctx.font='12px monospace'; ctx.fillStyle='#ccc';
  const str=`❤️${v['生命机能']} ⚡${v['体力耐力']} 🍖${v['饱腹值']} 🧠${v['精神状态']}`;
  ctx.fillText(str,W-ctx.measureText(str).width-12,28);
}

function drawPopup(){
  if(!popupMode||!popupData||popupData.length===0) return;
  const boxW=W-40,boxH=LINE_HEIGHT*(popupData.length+2)+BOX_PADDING*2;
  const x=20,y=(H-boxH)/2;
  ctx.fillStyle='rgba(30,30,30,0.95)'; ctx.fillRect(x,y,boxW,boxH);
  ctx.strokeStyle='#fff'; ctx.strokeRect(x,y,boxW,boxH);
  ctx.fillStyle='#fff'; ctx.font=FONT_SIZE+'px monospace';
  ctx.fillText(popupTitle,x+BOX_PADDING,y+BOX_PADDING+FONT_SIZE);
  for(let i=0;i<popupData.length;i++){
    ctx.fillStyle=(i===selectedIndex)?'#ffee88':'#cccc88';
    ctx.fillRect(x+BOX_PADDING, y+BOX_PADDING+FONT_SIZE+(i+1)*LINE_HEIGHT-14, boxW-BOX_PADDING*2, LINE_HEIGHT);
    ctx.fillStyle='#000';
    ctx.fillText(popupData[i].label, x+BOX_PADDING+4, y+BOX_PADDING+FONT_SIZE+(i+1)*LINE_HEIGHT);
  }
}

function drawButton(label,x,y,width,highlight=false){
  ctx.fillStyle=highlight?'#ffee88':'#cccc88';
  ctx.fillRect(x,y,width,BUTTON_HEIGHT);
  ctx.strokeStyle='#fff'; ctx.strokeRect(x,y,width,BUTTON_HEIGHT);
  ctx.fillStyle='#000';
  ctx.font='14px sans-serif';
  ctx.fillText(label,x+10,y+25);
}

function drawMainButtons(){
  if(currentView==='welcome'){
    const btnW=W*0.3;
    drawButton('新生命',(W-btnW)/2,H-120,btnW);
    drawButton('继续',(W-btnW)/2,H-60,btnW);
    return;
  }
  const btnY1=H-110, btnY2=H-60;
  const btnW=W*BUTTON_WIDTH_RATIO;
  drawButton('探索',20,btnY1,btnW);
  drawButton('钓鱼',40+btnW,btnY1,btnW);
  drawButton('战斗',60+btnW*2,btnY1,btnW);
  drawButton('背包',80+btnW*2,btnY2,btnW);
  drawButton('营地',100+btnW*3,btnY2,btnW);
  drawButton('地图',120+btnW*3,btnY2,btnW);
  drawButton('营业',W-80,btnY2,60);
  drawButton('存档',W-80,10,60);
}

function drawScreen(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  if(currentView==='welcome'){
    ctx.fillStyle='#FFD700'; ctx.font='48px serif';
    ctx.textAlign='center';
    ctx.fillText('众生之门',W/2,H/2-40);
    ctx.fillStyle='#D8BFD8'; ctx.font='20px serif';
    ctx.fillText('万物皆玩家，静默求生。',W/2,H/2);
  } else {
    drawStatusBar();
    let y=STATUS_BAR_HEIGHT+4;
    for(let m of messages){
      ctx.fillStyle=TYPE_COLORS[m.type]||TYPE_COLORS.normal;
      ctx.font=FONT_SIZE+'px monospace';
      ctx.textAlign='left';
      ctx.fillText(m.text,PADDING,y);
      y+=LINE_HEIGHT+BOX_SPACING;
    }
  }
  drawPopup();
  drawMainButtons();
}

// ====================== 核心玩法 ======================
async function callAPI(path,method='GET',body=null){
  try{
    const res=await fetch(`${API_BASE}${path}`,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):null});
    return await res.json();
  }catch(e){ console.log('API错误',e); return null; }
}

async function newLife(){
  clearScreen();
  const res=await callAPI('/player/new_life','POST');
  if(res){
    playerData=res['玩家状态'];
    playerData.current_map=MOCK_MAPS[0];
    currentView='main';
    addMessage(res['叙事文字'],'system');
    drawScreen();
  }
}

async function explore(){
  if(!playerData) return;
  const res=await callAPI(`/game/explore?player_id=${playerData.id}`,'POST');
  if(res){ addMessage(res['叙事'],'normal'); (res['获得道具']||[]).forEach(it=>{
    addMessage(`获得：${it.道具}`,'heal'); 
    playerData.inventory[it.道具]=(playerData.inventory[it.道具]||0)+1;
  }); }
  triggerRandomEvent();
  addSyncTask({endpoint:'/game/explore',body:{map:playerData.current_map||'未知',player_id:playerData.id}});
}

async function fishing(){
  if(!playerData) return;
  const res=await callAPI(`/game/fishing?player_id=${playerData.id}`,'POST');
  if(res){ addMessage(res['叙事'],'normal'); (res['获得道具']||[]).forEach(it=>{
    addMessage(`获得：${it.道具}`,'heal'); 
    playerData.inventory[it.道具]=(playerData.inventory[it.道具]||0)+1;
  }); }
  addSyncTask({endpoint:'/game/fishing',body:{player_id:playerData.id}});
}

async function battle(){
  if(!playerData) return;
  const res=await callAPI(`/game/battle?player_id=${playerData.id}`,'POST');
  if(res){ addMessage(res['战斗描述'],'battle'); }
  addSyncTask({endpoint:'/game/battle',body:{player_id:playerData.id}});
}

function showInventory(){ addMessage('查看背包','system'); drawScreen(); }
function showMap(){ addMessage('查看地图','system'); drawScreen(); }
function showCamp(){ addMessage('查看营地','system'); drawScreen(); }
function toggleStall(){ addMessage('营业开关','system'); drawScreen(); }
function saveGame(){ localStorage.setItem('playerData',JSON.stringify(playerData)); addMessage('存档成功','system'); drawScreen(); }

// ====================== 随机事件 ======================
function triggerRandomEvent(){
  if(!playerData) return;
  const eventRes=RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)];
  popupTitle='随机事件';
  popupData=eventRes.选项.map(opt=>({label:opt.label,action:()=>{
    (opt.结果.获得道具||[]).forEach(it=>{
      addMessage(`获得：${it.道具}`,'heal');
      playerData.inventory[it.道具]=(playerData.inventory[it.道具]||0)+1;
    });
    popupMode=null; popupData=[]; selectedIndex=0; drawScreen();
  }}));
  popupMode='event_choice';
  addMessage(eventRes.叙事,'event');
  drawScreen();
}

// ====================== 同步队列 ======================
function addSyncTask(task){ syncQueue.push(task); attemptSync(); }
async function attemptSync(){
  if(!navigator.onLine||syncQueue.length===0) return;
  const queueCopy=[...syncQueue];
  for(let task of queueCopy){
    try{
      await callAPI(task.endpoint,'POST',task.body);
      syncQueue.splice(syncQueue.indexOf(task),1);
    }catch(e){ console.log('同步失败',task);}
  }
}

// ====================== 点击事件 ======================
canvas.addEventListener('touchend',e=>{ handleButtonPress(e.changedTouches[0].clientX,e.changedTouches[0].clientY); });
canvas.addEventListener('mouseup',e=>{ handleButtonPress(e.clientX,e.clientY); });

function handleButtonPress(x,y){
  if(currentView==='welcome'){
    const btnW=W*0.3;
    if(y>H-120 && y<H-120+BUTTON_HEIGHT) newLife();
    if(y>H-60 && y<H-60+BUTTON_HEIGHT) newLife();
    return;
  }
  if(currentView!=='main'||!playerData) return;
  const btnW=W*BUTTON_WIDTH_RATIO;
  // 底部按钮
  if(x>=20 && x<=20+btnW && y>=H-110 && y<=H-110+BUTTON_HEIGHT) explore();
  else if(x>=40+btnW && x<=40+btnW*2 && y>=H-110 && y<=H-110+BUTTON_HEIGHT) fishing();
  else if(x>=60+btnW*2 && x<=60+btnW*3 && y>=H-110 && y<=H-110+BUTTON_HEIGHT) battle();
  else if(x>=80+btnW*2 && x<=80+btnW*3 && y>=H-60 && y<=H-60+BUTTON_HEIGHT) showInventory();
  else if(x>=100+btnW*3 && x<=100+btnW*4 && y>=H-60 && y<=H-60+BUTTON_HEIGHT) showCamp();
  else if(x>=120+btnW*3 && x<=120+btnW*4 && y>=H-60 && y<=H-60+BUTTON_HEIGHT) showMap();
  else if(x>=W-80 && x<=W-20 && y>=H-60 && y<=H-60+BUTTON_HEIGHT) toggleStall();
  else if(x>=W-80 && x<=W-20 && y>=10 && y<=10+BUTTON_HEIGHT) saveGame();
}

// ====================== 初始化 ======================
function init(){ clearScreen(); drawScreen(); }
init();
</script>
</body>
</html>
